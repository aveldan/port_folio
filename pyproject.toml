[project]
name = "port-folio"
version = "0.1.0"
description = ""
authors = [
    {name = "Ankith Veldandi",email = "aveldan@alumni.iu.edu"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Lets tests import the app package without setting PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
# Test files are named like testProfiles.py rather than pytest's default test_*.py.
python_files = ["test*.py"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
